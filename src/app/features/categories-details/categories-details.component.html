<div class="min-h-screen bg-gray-50/50">
  <div class="bg-primary-600 text-white">
    <div class="container mx-auto px-4 py-12 sm:py-16">
      <nav class="flex items-center gap-2 text-sm text-white/70 mb-6">
        <a class="hover:text-white transition-colors" href="/">Home</a
        ><span class="text-white/40">/</span
        ><a class="hover:text-white transition-colors" href="/categories">Categories</a
        ><span class="text-white/40">/</span><span class="text-white font-medium">Music</span>
      </nav>
      <div class="flex items-center gap-5">
        <div
          class="w-16 h-16 rounded-2xl bg-white/20 backdrop-blur-sm flex items-center justify-center shadow-xl ring-1 ring-white/30 overflow-hidden"
        >
          <img
            alt="Music"
            class="w-12 h-12 object-contain"
            src="https://ecommerce.routemisr.com/Route-Academy-categories/1681511964020.jpeg"
          />
        </div>
        <div>
          <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">Music</h1>
          <p class="text-white/80 mt-1">Choose a subcategory to browse products</p>
        </div>
      </div>
    </div>
  </div>
  <div class="container mx-auto px-4 py-10">
    <a
      class="inline-flex items-center gap-2 text-gray-600 hover:text-primary-600 transition-colors mb-6"
      href="/categories"
    >
      <i class="fas fa-arrow-left"></i>
      <span>Back to Categories</span></a
    >
    <div class="mb-6">
      <h2 class="text-lg font-bold text-gray-900">8 Subcategories in Music</h2>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
      @for (item of subCategories(); track item._id) {
        <a
          [routerLink]="['']"
          class="group bg-white rounded-2xl border border-gray-100 p-6 shadow-sm hover:shadow-xl hover:border-primary-200 transition-all duration-300 hover:-translate-y-1"
          ><div
            class="w-14 h-14 rounded-xl bg-primary-50 flex items-center justify-center mb-4 group-hover:bg-primary-100 transition-colors"
          >
            <i class="fas fa-folder-open text-2xl text-primary-600"></i>
          </div>
          <h3
            class="font-bold text-gray-900 text-lg group-hover:text-primary-600 transition-colors mb-2"
          >
            {{ item.name }}
          </h3>
          <div
            class="flex items-center gap-2 text-sm text-primary-600 opacity-0 group-hover:opacity-100 transition-opacity"
          >
            <span>Browse Products</span>
            <i class="fas fa-arrow-right text-xs"></i></div
        ></a>
      }
    </div>
  </div>
</div>
